# dauthz-gate: include this file inside the `server { }` block that serves
# the protected site. It assumes the gate is reachable as `dauthz-gate:8088`
# on the same docker network (adjust the two proxy_pass lines otherwise).
#
#   server {
#       listen 80;
#       root /usr/share/nginx/html;
#       include /etc/nginx/dauthz/dauthz-gate.locations.conf;
#       location / { try_files $uri /index.html; }
#   }
#
# Every request runs the /dauthz/auth subrequest first; a 401 from the gate
# becomes a redirect to the login page carrying the original URI.

auth_request /dauthz/auth;
error_page 401 = @dauthz_login;

location = /dauthz/auth {
    internal;
    proxy_pass              http://dauthz-gate:8088/dauthz/auth;
    proxy_pass_request_body off;
    proxy_set_header        Content-Length "";
    proxy_set_header        X-Original-URI    $request_uri;
    proxy_set_header        X-Original-Method $request_method;
}

location /dauthz/ {
    auth_request off;
    proxy_pass         http://dauthz-gate:8088;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    # A wallet callback triggers KEL resolution and signature checks on the
    # daemon; multi-witness identities can take well over 30 s.
    proxy_read_timeout 120s;
}

location @dauthz_login {
    # Keep the Location relative: nginx would otherwise rebuild it from its
    # own listen port, which is wrong behind a port mapping or a proxy.
    absolute_redirect off;
    return 302 /dauthz/login?return=$request_uri;
}
