<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" href="{{ASSET_BASE}}/dauthz-login.css">
    <!-- Optional per-plugin theme override. A plugin that wants to restyle the
         page (typically by redefining the :root Cyfron design tokens) sets this
         token to an extra <link>/<style>; backends default it to empty. -->
    {{THEME_HEAD}}
</head>
<body>
    <!-- Per-plugin configuration. The backend replaces the comment+{} token with
         a single JSON object; the default {} keeps this file openable as-is for
         local development. See dauthz-login.js for the config contract. -->
    <script>window.DAUTHZ_LOGIN = /*__DAUTHZ_CONFIG__*/{};</script>

    <div class="card">
        <div class="eyebrow">Cyfron · Auth</div>
        <h1>
            <span id="dz-h1-text">Sign in</span><span id="dz-mode-chip" class="mode-chip"></span>
        </h1>
        <p class="lede">
            <strong id="dz-svc-strong">This service</strong> will ask your Cyfron app to prove control of your AID
            and share <span id="dz-attrs" class="attrs"></span>.
        </p>

        <!-- V3 · Outline ghost -->
        <button id="connect-btn" class="cy-btn cy-btn-outline" onclick="connectWithCyfron()">
            <svg width="19" height="19" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M18 7.2 A6.5 6.5 0 1 0 18 16.8"
                      fill="none" stroke="#4d7cff" stroke-width="2.6" stroke-linecap="round"/>
                <circle cx="17.4" cy="12" r="1.7" fill="#4d7cff"/>
            </svg>
            <span>Connect with Cyfron</span>
        </button>

        <button id="copy-url-btn" class="copy-url-link" type="button" onclick="copyConnectUrl()">Copy the URL</button>

        <button id="qr-btn" class="copy-url-link" type="button" onclick="showQrCode()">Sign in from your phone</button>

        <div id="qr-wrap" class="qr-wrap hidden">
            <div id="qr-code" class="qr-code"></div>
            <p class="qr-caption">Scan with your phone's camera to open Cyfron and approve the sign-in. This page will continue automatically.</p>
        </div>

        <div class="field">
            <div class="field-label">
                <span>Invite token</span>
                <span class="hint" id="invite-required-hint"></span>
            </div>
            <input type="text" id="invite-token" placeholder="paste-invite-token-if-you-have-one">
        </div>

        <div id="connect-status" class="status hidden"></div>

        <div class="service-info">
            <div class="label">Service OOBI — proves this is the real <span id="dz-svc-name-oobi"></span></div>
            <div class="value" id="dz-svc-oobi"></div>
        </div>

    </div>

    <div class="dauthz-build" id="dz-build"></div>

    <script src="{{ASSET_BASE}}/qrcode.min.js"></script>
    <script src="{{ASSET_BASE}}/dauthz-login.js"></script>
</body>
</html>
