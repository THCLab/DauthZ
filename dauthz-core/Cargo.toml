[package]
name = "dauthz-core"
version.workspace = true
edition.workspace = true

[features]
wasm = ["uuid/js", "chrono/wasmbind"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

[package.metadata.release]
tag = true
tag-name = "v{{version}}"
# Shared changelog at the workspace root. `--unreleased --prepend` adds the new
# section and leaves earlier, possibly hand-edited, sections alone. The hook
# runs from this crate's directory, hence the `../` paths.
pre-release-hook = [
    "git", "cliff",
    "--tag", "v{{version}}",
    "--config", "../cliff.toml",
    "--repository", "../",
    "--unreleased",
    "--prepend", "../CHANGELOG.md",
]
