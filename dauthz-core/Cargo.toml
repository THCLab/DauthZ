[package]
name = "dauthz-core"
version = "0.1.0"
edition = "2021"

[features]
wasm = ["uuid/js", "chrono/wasmbind"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
